{% extends "base.html" %}{% block title %}Register{% endblock %}{% block content %}
<div class="card"><h1>Register</h1>
<form method="post" novalidate><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label for="username">Username</label><input id="username" name="username" value="{{ username or '' }}" maxlength="30" required autocomplete="username"><small>3-30 letters, numbers or underscore</small>
<label for="email">Email</label><input id="email" name="email" type="email" value="{{ email or '' }}" maxlength="254" required autocomplete="email">
<label for="password">Password</label><input id="password" name="password" type="password" maxlength="128" required autocomplete="new-password"><small>At least 10 characters, with a letter and a number</small>
<label for="confirm">Confirm password</label><input id="confirm" name="confirm" type="password" maxlength="128" required autocomplete="new-password">
<button class="primary" type="submit">Create account</button></form></div>
{% endblock %}
